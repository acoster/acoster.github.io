<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    {{ with site.Menus.main }}
    <nav>
      {{ range . }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    {{ end }}
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ now.Year }} {{ site.Title }}{{ with site.GetPage "/posts" }}{{ with .OutputFormats.Get "rss" }} · <a href="{{ .RelPermalink }}">RSS</a>{{ end }}{{ end }}</p>
  </footer>
</body>
</html>
