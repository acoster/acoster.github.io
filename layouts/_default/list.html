{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="prose">
  {{ .Content }}
</div>
<ul class="page-list">
  {{ range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
