{{ define "main" }}
<h1>{{ .Title }}</h1>

<div class="prose">
  {{ .Content }}
</div>

{{ with site.Params.links }}
<ul class="social">
  {{ range . }}
  <li>
    <a href="{{ .url }}"{{ with .rel }} rel="{{ . }}"{{ end }}>
      <img src="{{ printf "assets/%s" .icon | relURL }}" alt="{{ .name }}"{{ if .invertOnDark }} class="invert-on-dark"{{ end }}>
    </a>
  </li>
  {{ end }}
</ul>
{{ end }}

{{ with site.RegularPages }}
<section>
  <h2>Writing</h2>
  <ul class="page-list">
    {{ range . }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>{{ end }}
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
