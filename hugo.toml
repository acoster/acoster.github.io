baseURL = "https://alex.coster.ch/"
languageCode = "en"
title = "Alex Coster"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Alex Coster's homepage."

  # Icon links shown on the home page, in this order.
  # icon: file in static/assets/. rel: optional (Mastodon needs "me" for profile verification).
  # invertOnDark: flip a black icon to white in dark mode.
  [[params.links]]
    name = "LinkedIn"
    url = "https://ch.linkedin.com/in/acoster"
    icon = "linkedin.png"
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/acoster"
    icon = "github.png"
    invertOnDark = true
  [[params.links]]
    name = "Mastodon"
    url = "https://mas.to/@coster"
    icon = "mastodon.svg"
    rel = "me"

[markup.goldmark.renderer]
  unsafe = false

# Keeps processed assets between CI runs (see .github/workflows/hugo.yml).
[caches.images]
  dir = ":cacheDir/images"

[services.googleAnalytics]
  id = "G-L9HPC8TLTY"
